[project]
name = "alldash-platform"
version = "0.1.0"
description = "All Dash platform API: projects, tasks, invoices, expenses, a hash-chained AI audit ledger and the daily update engine."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]
"scripts/*" = ["E501", "E731"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
