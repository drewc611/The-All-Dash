# Templates only. Never commit real values. Create the real Secrets with
# kubectl (see README "Bootstrap secrets") or from AWS Secrets Manager via
# the External Secrets Operator. All five Secrets must exist before the
# Deployments start.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: alldash
type: Opaque
stringData:
  POSTGRES_USER: alldash
  POSTGRES_PASSWORD: replace-with-a-long-random-password
  # The API and worker read this one; it embeds the two values above.
  ALLDASH_DATABASE_URL: postgresql+asyncpg://alldash:replace-with-a-long-random-password@postgres.alldash.svc.cluster.local:5432/alldash
---
apiVersion: v1
kind: Secret
metadata:
  name: alldash-api
  namespace: alldash
type: Opaque
stringData:
  # Comma-separated. Rotate by adding the new key, rolling the frontend and
  # cron to it, then removing the old one.
  ALLDASH_API_KEYS: replace-with-a-long-random-key
  # The key the frontend and the CronJob present. One of the values above.
  BACKEND_API_KEY: replace-with-a-long-random-key
  # Optional. Web search, JavaScript rendering and screenshots use Firecrawl;
  # without a key those three answer 501 and scrape, map, crawl and batch
  # still work.
  ALLDASH_FIRECRAWL_API_KEY: ""
  # Optional. Extract and agent need a model: anthropic, openai (any
  # chat-completions endpoint) or ollama. Off while the provider is empty.
  ALLDASH_LLM_PROVIDER: ""
  ALLDASH_LLM_MODEL: ""
  ALLDASH_LLM_API_KEY: ""
  ALLDASH_LLM_BASE_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: alldash
type: Opaque
stringData:
  REDIS_PASSWORD: replace-with-a-long-random-password
  # The API, worker and beat read this one; it embeds the value above.
  ALLDASH_REDIS_URL: redis://:replace-with-a-long-random-password@redis.alldash.svc.cluster.local:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: alldash-frontend
  namespace: alldash
type: Opaque
stringData:
  # HTTP Basic credentials for the workspace. The frontend refuses to serve
  # without them (FRONTEND_AUTH_DISABLED=true opts out behind an
  # authenticating proxy such as ALB OIDC or oauth2-proxy).
  FRONTEND_AUTH_USER: drew
  FRONTEND_AUTH_PASSWORD: replace-with-a-long-random-password
---
apiVersion: v1
kind: Secret
metadata:
  name: alldash-mcp
  namespace: alldash
type: Opaque
stringData:
  # Presented as "Authorization: Bearer <token>" by ChatGPT, Claude or Copilot
  # when they connect to https://<host>/mcp.
  MCP_AUTH_TOKEN: replace-with-a-long-random-token
