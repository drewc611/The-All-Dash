# 04:00 every day: build the morning brief through the API. `sync=true`
# makes the call block until the brief exists, so a failed build is a
# failed Job and shows up as such. Celery beat also schedules a build at
# 04:05 as a second path; a rebuild for the same date replaces the first.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-brief
  namespace: alldash
  labels:
    app.kubernetes.io/name: daily-brief
spec:
  schedule: "0 4 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: daily-brief
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ping
              image: curlimages/curl:8.11.1
              env:
                - name: BACKEND_URL
                  valueFrom:
                    configMapKeyRef:
                      name: alldash-config
                      key: BACKEND_URL
                - name: BACKEND_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alldash-api
                      key: BACKEND_API_KEY
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  code=$(curl -sS -o /tmp/brief.json -w '%{http_code}' \
                    --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 \
                    -X POST -H "X-API-Key: ${BACKEND_API_KEY}" \
                    "${BACKEND_URL}/daily/run?sync=true")
                  echo "daily/run answered ${code}"
                  head -c 600 /tmp/brief.json; echo
                  test "$code" = "202"
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 8Mi
