# Flathub manifest.
#
# Flathub builds from source on its own infrastructure, so this cannot just
# unpack the .deb from a GitHub release - it fetches the tagged source and
# builds it. That is the whole reason Flathub is worth submitting to: the
# thing people install is built from code anyone can read.
#
# Two things a reviewer will check first, so they are stated here rather than
# discovered: the app talks to no network by default, and it has no server.
app-id: com.thealldash.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: the-all-dash

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Sound and camera are for Studio. Both are opt-in inside the app and the
  # portal prompts before either is used.
  - --socket=pulseaudio
  - --device=all
  # Network is here because three optional features need it: fetching a page
  # into the stash, talking to a model provider, and the YouTube embed. With
  # none of them configured the app never opens a socket, which is worth
  # saying plainly in the submission rather than leaving a reviewer to guess.
  - --share=network

modules:
  - name: the-all-dash
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
      env:
        CARGO_HOME: /run/build/the-all-dash/cargo
    build-commands:
      # Offline, from the vendored sources generated by the generator scripts.
      # Flathub's builders have no network during a build, by design.
      - npm ci --offline --cache npm-cache
      - npm run build
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/the-all-dash /app/bin/the-all-dash
      - install -Dm644 packaging/flatpak/com.thealldash.app.desktop /app/share/applications/com.thealldash.app.desktop
      - install -Dm644 packaging/flatpak/com.thealldash.app.metainfo.xml /app/share/metainfo/com.thealldash.app.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.thealldash.app.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.thealldash.app.png
    sources:
      - type: git
        url: https://github.com/drewc611/The-All-Dash.git
        # Set to the release tag at submission time. Flathub requires a tag or
        # a commit, never a branch - a moving target is not reproducible.
        tag: PLACEHOLDER_TAG
        commit: PLACEHOLDER_COMMIT
      # Generated, not written by hand:
      #   flatpak-cargo-generator.py src-tauri/Cargo.lock -o cargo-sources.json
      #   flatpak-node-generator npm package-lock.json -o node-sources.json
      - cargo-sources.json
      - node-sources.json
