[package]
name = "the-all-dash"
version = "0.1.0"
description = "A command center for a project or a person."
authors = ["The All Dash"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Remembers window size and position between launches. A desktop app that
# opens at 800x600 in the corner every time is the clearest tell that it is a
# web page in a frame.
tauri-plugin-window-state = "2"

# The binary is the whole point of choosing Tauri over Electron, so the release
# profile is tuned for size rather than left at the default.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
