name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes made by a GitHub App (Copilot's coding agent, for one) do not start
  # pull_request runs, so allow a manual run from the Actions tab.
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Pacific/Auckland npm test
      - run: npm run build
