name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes made by a GitHub App (Copilot's coding agent, for one) do not start
  # pull_request runs, so allow a manual run from the Actions tab.
  workflow_dispatch:

# The workflow only reads the checkout; no job needs a write token.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Pacific/Auckland npm test
      - run: npm run build

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests and lint
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check app tests scripts alembic
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP server tests
        working-directory: mcp
        run: |
          npm ci
          npm test
      - name: Frontend typecheck, lint and build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Kubernetes manifests render and validate
        run: |
          curl -sSLo kubectl https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl && chmod +x kubectl
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubectl kustomize k8s/overlays/prod > rendered.yaml
          ./kubectl kustomize k8s/ingress/nginx-letsencrypt > rendered-nginx.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 rendered.yaml rendered-nginx.yaml k8s/secrets.example.yaml
      - name: Compose file validates
        run: docker compose -f docker-compose.yml config --quiet
      - name: Images build
        run: |
          docker build -q backend -t alldash-backend:ci
          docker build -q frontend -t alldash-frontend:ci
          docker build -q -f mcp/Dockerfile . -t alldash-mcp:ci
          # The browser app's image builds from the same root context as the
          # MCP one, which is how an exclusion added for either can silently
          # empty the other's. Building both here means a tag push is not the
          # first time anybody finds out.
          docker build -q . -t alldash-app:ci
          # The MCP image must start in platform mode and answer its health check.
          docker run -d --rm --name mcp-ci -e MCP_AUTH_TOKEN=ci -e ALLDASH_API_URL=http://backend:8000 -e ALLDASH_API_KEY=ci -p 18080:8080 alldash-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/healthz && break || sleep 1; done
          docker logs mcp-ci
          docker stop mcp-ci
          # The app image: it must serve index.html and the wallpaper credits
          # it links to. An image that builds and serves nothing is a green
          # check and a broken deploy.
          docker run -d --rm --name app-ci -p 18081:8080 alldash-app:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:18081/index.html && break || sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:18081/index.html
          curl -fsS -o /dev/null http://127.0.0.1:18081/wallpapers/CREDITS.md
          curl -fsS -o /dev/null http://127.0.0.1:18081/wallpapers/night.avif
          docker stop app-ci
