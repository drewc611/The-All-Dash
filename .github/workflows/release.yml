name: Release

# Three ways in, one behaviour.
#
#   1. Push a tag. `npm run release -- <version>` writes package.json and
#      tauri.conf.json, commits and tags; pushing the tag starts this.
#
#   2. Run it from the Actions tab. The version comes from package.json on the
#      branch you pick, and this workflow creates the tag itself.
#
#   3. Push a branch named `release/v<version>`. Same as 2, for anyone who
#      cannot press the button either.
#
# Two and three exist because creating a tag is not always available to whoever
# cut the release - a restricted token, a CI runner, a machine with no
# checkout. GITHUB_TOKEN here has `contents: write` and can create one, so a
# release does not have to wait on somebody's laptop.
#
# Three exists because two was not enough, which is the sort of thing you only
# learn by trying to release from a restricted credential. The same token can
# be refused a tag ref with HTTP 403 *and* refused workflow_dispatch with
# "Resource not accessible by integration", while pushing an ordinary branch
# works perfectly well. That is what happened cutting v0.2.0-rc.1: two doors
# locked, one open. A release process with one way in is a release process that
# stops the day that way is shut, and the fix is another door rather than a
# person with the right laptop.
#
# A tag created with GITHUB_TOKEN deliberately does not start another workflow
# run - GitHub's recursion guard - so there is no double release: the manual
# run creates the tag and then does all the work itself.
#
# The channel is derived from the version either way, exactly as the app
# derives it from its stamped version, so a build cannot advertise one channel
# and gate its flags on another.
on:
  push:
    tags: ['v*']
    # `release/v1.2.3` releases 1.2.3. The branch is a trigger and nothing
    # else - it carries no commits of its own - and `verify` still refuses when
    # it disagrees with package.json, so a stale release branch cannot publish
    # a version the tree does not claim.
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Must match package.json on this branch. Blank uses whatever package.json says.'
        required: false
        type: string
      dry_run:
        description: 'Check everything and build, but create no tag and publish nothing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version and its channel
        id: tag
        run: |
          in_tree=$(node -p "require('./package.json').version")
          # Three ways in, three shapes of ref. Stripping a leading "v" off a
          # branch called release/v0.2.0 leaves "release/v0.2.0", which then
          # fails the check below with a message about package.json: true,
          # useless, and pointing at the wrong file.
          case "${{ github.event_name }}:${{ github.ref_type }}" in
            push:tag)    version="${GITHUB_REF_NAME#v}" ;;
            push:branch) version="${GITHUB_REF_NAME#release/v}" ;;
            *)           version="${{ inputs.version }}"
                         [ -n "$version" ] || version="$in_tree" ;;
          esac

          # Whichever way in: the version being released and the version the
          # build stamps into itself have to be the same one, or the app would
          # report a channel the release does not claim.
          if [ "$in_tree" != "$version" ]; then
            echo "::error::releasing $version but package.json says $in_tree — run 'npm run release -- $version' and push that commit first"
            exit 1
          fi

          channel=$(node -e "import('./scripts/version.mjs').then(m => console.log(m.channelFor(process.argv[1])))" "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          if [ "$channel" = "stable" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::$version on the $channel channel (via ${{ github.event_name }})"

      - name: The changelog must describe this version
        run: |
          grep -q "## \[${{ steps.tag.outputs.version }}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for ${{ steps.tag.outputs.version }}"
            exit 1
          }

      - run: npm ci
      - run: npm test
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Pacific/Auckland npm test

      # Last, and only on a manual run: the tag is created here rather than
      # needing a checkout with tag-push rights. It comes after the suite so a
      # failing build never leaves a tag behind pointing at it.
      #
      # An existing tag is left where it is rather than moved — a tag people
      # may already have fetched is not rewritten, which is the same rule
      # scripts/release.mjs enforces locally.
      - name: Create the tag
        # Both tagless ways in. A tag push already has its tag, and there
        # `inputs.dry_run` is null, which is falsey, so the guard still holds.
        if: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'branch') && !inputs.dry_run }}
        run: |
          tag="v${{ steps.tag.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists; leaving it where it is"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "${{ steps.tag.outputs.version }} (${{ steps.tag.outputs.channel }})"
          git push origin "refs/tags/$tag"
          echo "::notice::created $tag"

  # A stable release additionally requires the whole platform green. A
  # prerelease does not: the point of alpha is getting something in front of
  # people while parts of it are still moving.
  platform:
    if: ${{ needs.verify.outputs.channel == 'stable' }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests and lint
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check app tests scripts alembic
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP server tests
        working-directory: mcp
        run: |
          npm ci
          npm test

  # ------------------------------------------------------------- the web build
  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Pack the build
        run: tar -czf "the-all-dash-web-${{ needs.verify.outputs.version }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: the-all-dash-web-*.tar.gz
          retention-days: 90

  # -------------------------------------------------------------- the container
  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # Otherwise this action uploads a `*.dockerbuild` build record as a
          # workflow artifact, which `publish` then tries to download along
          # with everything else and fails on. Nothing reads it and it is not
          # part of the release.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A dry run builds the image and throws it away.
          push: ${{ github.event_name == 'push' || !inputs.dry_run }}
          # The channel is a tag too, so `:alpha` always points at the newest
          # alpha without anybody having to look up its number. `:latest` moves
          # only for a stable release - a prerelease taking latest is how
          # people end up running an alpha by accident.
          tags: |
            ghcr.io/${{ github.repository_owner }}/all-dash:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/all-dash:${{ needs.verify.outputs.channel }}
            ${{ needs.verify.outputs.channel == 'stable' && format('ghcr.io/{0}/all-dash:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- the desktop
  desktop:
    needs: verify
    strategy:
      # One platform failing should not deny the others their artifacts - a
      # missing Windows certificate must not also cost the Linux build.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: mac-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # Ubuntu 22.04 rather than 24.04 on purpose: an AppImage built against a
      # newer glibc will not start on an older distribution, and the oldest
      # runner available sets the floor for who can run this.
      - name: Linux webview and packaging tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev

      - run: npm ci

      # An absent secret is an EMPTY STRING, not an absent variable. Passing
      # APPLE_CERTIFICATE="" makes tauri try to import an empty certificate,
      # and `security import` fails, and the whole macOS bundle fails with it -
      # after the Rust build has already succeeded. So the unsigned build is
      # not the same command with fewer secrets; it is a command that must not
      # be handed the secrets at all.
      - name: Is there an Apple certificate to sign with?
        id: signing
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then
            echo "apple=yes" >> "$GITHUB_OUTPUT"
          else
            echo "apple=no" >> "$GITHUB_OUTPUT"
            echo "::warning::no APPLE_CERTIFICATE secret; macOS builds will be unsigned and Gatekeeper will warn on first open"
          fi

      - name: Build and bundle, signed
        if: steps.signing.outputs.apple == 'yes'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}

      - name: Build and bundle, unsigned
        if: steps.signing.outputs.apple != 'yes'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 90

  # ----------------------------------------------------------------- the release
  publish:
    needs: [verify, platform, web, container, desktop]
    # `platform` is skipped for a prerelease, and a desktop target may fail
    # without a certificate. Without always() a skipped dependency skips this
    # job too and nothing is ever published.
    if: ${{ always() && needs.verify.result == 'success' && needs.web.result == 'success' && needs.platform.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Name what the release carries rather than taking whatever the run
          # happens to contain. Without this it downloads every artifact in the
          # run, which on the first real release meant a `.dockerbuild` build
          # record uploaded by docker/build-push-action: it failed to extract
          # after five retries and took the whole publish down with it, after
          # every other job had succeeded. An allow-list also means the next
          # action that quietly uploads something cannot break the release.
          pattern: '{web,desktop-*}'
          merge-multiple: true

      - name: Cut the release notes from the changelog
        run: |
          # The section for this version, up to the next heading. The notes
          # were written before the tag existed, which is the point.
          awk -v v="## [${{ needs.verify.outputs.version }}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/    { exit }
            on                { print }
          ' CHANGELOG.md > notes.md
          {
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|---|---|"
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              case "$name" in
                *.dmg)      echo "| macOS | \`$name\` |" ;;
                *.msi|*.exe) echo "| Windows | \`$name\` |" ;;
                *.AppImage) echo "| Linux (portable) | \`$name\` |" ;;
                *.deb)      echo "| Debian, Ubuntu | \`$name\` |" ;;
                *.rpm)      echo "| Fedora, RHEL | \`$name\` |" ;;
                *.tar.gz)   echo "| Web (self-host) | \`$name\` |" ;;
              esac
            done
            echo ""
            echo "Container: \`ghcr.io/${{ github.repository_owner }}/all-dash:${{ needs.verify.outputs.version }}\`"
            echo ""
            echo "---"
            echo "Channel: \`${{ needs.verify.outputs.channel }}\`. What that promises: [docs/RELEASING.md](docs/RELEASING.md)."
          } >> notes.md
          if [ "${{ needs.verify.outputs.channel }}" != "stable" ]; then
            echo "::warning::desktop installers may be unsigned; the OS will warn on first open"
          fi

      - uses: softprops/action-gh-release@v2
        # A dry run proves the whole thing builds and publishes nothing.
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        with:
          # On a manual run there is no tag ref to infer this from.
          tag_name: v${{ needs.verify.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.verify.outputs.prerelease }}
          files: artifacts/*
          fail_on_unmatched_files: false
